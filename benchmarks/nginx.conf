daemon off;
worker_processes 1;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    error_log stderr warn;
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_requests 1000000;
    keepalive_timeout 65s;

    server {
        listen 8080;
        server_name localhost;

        root .;
        index index.html;

        location / {
            index index.html;
        }
    }
}
